<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cyberplay</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #222;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            font-size: 20px;
        }

        tr.ocupado {
            background: #ffb3b3;
            color: black;
        }

        tr.libre {
            background: #b8ffb8;
            color: black;
        }
    </style>
</head>

<body>

    <h1>
        Disponibilidad Equipos
    </h1>

    <table>

        <thead>
            <tr>
                <th>Nro</th>
                <th>Tipo</th>
                <th>Tiempo restante</th>
            </tr>
        </thead>

        <tbody id="tablaEquipos">
        </tbody>

    </table>

    <script>

        async function cargarEquipos()
        {
            try
            {
                const response =
                    await fetch(
                        "http://localhost:5288/equipos");

                const equipos =
                    await response.json();

                const tabla =
                    document.getElementById(
                        "tablaEquipos");

                tabla.innerHTML = "";

                equipos.forEach(
                    equipo =>
                    {
                        const fila =
                            document.createElement(
                                "tr");

                        if (equipo.activo)
                        {
                            fila.className =
                                "ocupado";
                        }
                        else
                        {
                            fila.className =
                                "libre";
                        }

                        fila.innerHTML =
                            `
                            <td>${equipo.numero}</td>
                            <td>${equipo.tipo}</td>
                            <td>${equipo.tiempoRestante}</td>
                            `;

                        tabla.appendChild(
                            fila);
                    });
            }
            catch
            {
                console.log(
                    "Error API");
            }
        }

        cargarEquipos();

        setInterval(
            cargarEquipos,
            1000);

    </script>

</body>

</html>
